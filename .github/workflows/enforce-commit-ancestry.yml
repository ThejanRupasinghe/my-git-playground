name: Enforce Commit Ancestry

on:
  pull_request:
    branches: [stg, master]

jobs:
  # Using a matrix makes GitHub treat these as separate, 
  # uniquely identifiable status checks.
  ancestry-validation:
    # This is the name you will see in the PR
    name: "Ancestry Validation (${{ matrix.target }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # This ensures the job only runs for the current PR's target
        target: [ "${{ github.base_ref }}" ]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Lineage
        run: |
          TARGET="${{ matrix.target }}"
          SOURCE="${{ github.event.pull_request.head.sha }}"
          
          echo "Verifying ancestry for PR targeting: $TARGET"

          # Function to check if commits exist in a reference branch
          check_exists_in() {
            local ref_branch=$1
            echo "Checking: Do all PR commits exist in origin/$ref_branch?"
            
            # List commits in PR not in current target
            PR_COMMITS=$(git rev-list origin/$TARGET..$SOURCE)
            
            for commit in $PR_COMMITS; do
              if ! git branch -r --contains "$commit" | grep -q "origin/$ref_branch"; then
                echo "::error::Commit $commit is missing from $ref_branch."
                exit 1
              fi
            done
          }

          if [ "$TARGET" == "stg" ]; then
            check_exists_in "dev"
          elif [ "$TARGET" == "master" ]; then
            check_exists_in "dev"
            check_exists_in "stg"
          fi
          
          echo "✅ Ancestry verified."