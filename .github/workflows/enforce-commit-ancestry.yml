name: Enforce Commit Ancestry

on:
  pull_request:
    branches: [stg, master]
  workflow_dispatch:

jobs:
  # --- STG GATE ---
  validate-stg:
    if: github.base_ref == 'stg'
    name: "Ancestry Gatekeeper" # Use a STATIC name for Branch Protection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify dev ancestry
        run: |
          PR_COMMITS=$(git rev-list origin/stg..${{ github.event.pull_request.head.sha }})
          for commit in $PR_COMMITS; do
            if ! git branch -r --contains "$commit" | grep -q "origin/dev"; then
              echo "::error::Commit $commit not found in dev. Merge to dev first."
              exit 1
            fi
          done

  # --- MASTER GATE ---
  validate-master:
    if: github.base_ref == 'master'
    name: "Ancestry Gatekeeper" # Same name, but only one will ever run per PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify stg ancestry
        run: |
          PR_COMMITS=$(git rev-list origin/master..${{ github.event.pull_request.head.sha }})
          for commit in $PR_COMMITS; do
            if ! git branch -r --contains "$commit" | grep -q "origin/stg"; then
              echo "::error::Commit $commit missing from stg. Merge to stg first."
              exit 1
            fi
          done