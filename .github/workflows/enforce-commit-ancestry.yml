name: Enforce Commit Ancestry

on:
  pull_request:
    branches: [stg, master] # Only trigger for the branches we protect

jobs:
  # --- STG VALIDATION ---
  # This job ONLY exists when the PR target is 'stg'
  validate-stg:
    if: github.base_ref == 'stg'
    name: "Ancestry Check: Must be in Dev"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify dev ancestry
        run: |
          PR_COMMITS=$(git rev-list origin/stg..${{ github.event.pull_request.head.sha }})
          for commit in $PR_COMMITS; do
            if ! git branch -r --contains "$commit" | grep -q "origin/dev"; then
              echo "::error::Commit $commit not found in dev."
              exit 1
            fi
          done

  # --- MASTER VALIDATION ---
  # This job ONLY exists when the PR target is 'master'
  validate-master:
    if: github.base_ref == 'master'
    name: "Ancestry Check: Must be in Dev and Stg"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify dev and stg ancestry
        run: |
          SHA=${{ github.event.pull_request.head.sha }}
          PR_COMMITS=$(git rev-list origin/master..$SHA)
          for commit in $PR_COMMITS; do
            if ! git branch -r --contains "$commit" | grep -q "origin/dev"; then
              echo "::error::Commit $commit missing from dev."
              exit 1
            fi
            if ! git branch -r --contains "$commit" | grep -q "origin/stg"; then
              echo "::error::Commit $commit missing from stg."
              exit 1
            fi
          done