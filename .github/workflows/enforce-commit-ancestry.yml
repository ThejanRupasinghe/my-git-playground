name: Enforce Commit Ancestry

on:
  pull_request:
    branches:
      - stg
      - master

jobs:
  check-ancestry:
    name: "Ancestry Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Ancestry Check
        run: |
          # Use the environment variable GitHub provides automatically
          TARGET_BRANCH="${{ github.base_ref }}"
          SOURCE_SHA="${{ github.event.pull_request.head.sha }}"
          
          echo "Target branch for this specific run: $TARGET_BRANCH"

          # 1. AUTO-PASS for dev or other branches
          if [[ "$TARGET_BRANCH" != "stg" && "$TARGET_BRANCH" != "master" ]]; then
            echo "✅ $TARGET_BRANCH is not a restricted branch. Passing check."
            exit 0
          fi

          # 2. ANCESTRY LOGIC
          check_lineage() {
            local required_branch=$1
            echo "Verifying commits exist in 'origin/$required_branch'..."
            
            PR_COMMITS=$(git rev-list origin/$TARGET_BRANCH..$SOURCE_SHA)
            
            if [ -z "$PR_COMMITS" ]; then
              echo "No new commits found relative to $TARGET_BRANCH."
              return
            fi

            for commit in $PR_COMMITS; do
              if ! git branch -r --contains "$commit" | grep -q "origin/$required_branch"; then
                echo "::error::Commit $commit is missing from $required_branch."
                exit 1
              fi
            done
          }

          # 3. THE RULES
          if [ "$TARGET_BRANCH" == "stg" ]; then
            check_lineage "dev"
          elif [ "$TARGET_BRANCH" == "master" ]; then
            check_lineage "stg"
            check_lineage "dev"
          fi
          
          echo "🚀 Ancestry verified for $TARGET_BRANCH!"