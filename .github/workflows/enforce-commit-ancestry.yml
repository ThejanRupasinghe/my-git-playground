name: Enforce Commit Ancestry

on:
  pull_request:
    branches: [stg, master]

jobs:
  # This job only RUNS if the PR is targeting stg
  validate-stg:
    if: github.base_ref == 'stg'
    name: "Ancestry Validation (stg)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify dev ancestry
        run: |
          # Only check dev ancestry
          PR_COMMITS=$(git rev-list origin/stg..${{ github.event.pull_request.head.sha }})
          for commit in $PR_COMMITS; do
            if ! git branch -r --contains "$commit" | grep -q "origin/dev"; then
              echo "::error::Commit $commit missing from dev."
              exit 1
            fi
          done

  # This job only RUNS if the PR is targeting master
  validate-master:
    if: github.base_ref == 'master'
    name: "Ancestry Validation (master)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify stg ancestry
        run: |
          # Only check stg ancestry
          PR_COMMITS=$(git rev-list origin/master..${{ github.event.pull_request.head.sha }})
          for commit in $PR_COMMITS; do
            if ! git branch -r --contains "$commit" | grep -q "origin/stg"; then
              echo "::error::Commit $commit missing from stg."
              exit 1
            fi
          done