name: Enforce Commit Ancestry

on:
  pull_request:
    branches: [stg, master]
  workflow_dispatch:

jobs:
  # The 'id' here is just a label, but the 'name' is what GitHub uses
  # to track the status check.
  ancestry-validation:
    # Adding the PR number to the name makes this unique per PR.
    name: "Ancestry Validation (Target: ${{ github.base_ref }}) - PR #${{ github.event.pull_request.number }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Lineage
        run: |
          TARGET="${{ github.base_ref }}"
          SOURCE="${{ github.event.pull_request.head.sha }}"
          
          check_exists_in() {
            local ref_branch=$1
            echo "Checking origin/$ref_branch..."
            PR_COMMITS=$(git rev-list origin/$TARGET..$SOURCE)
            
            for commit in $PR_COMMITS; do
              if ! git branch -r --contains "$commit" | grep -q "origin/$ref_branch"; then
                echo "::error::Commit $commit is missing from $ref_branch."
                exit 1
              fi
            done
          }

          if [ "$TARGET" == "stg" ]; then
            check_exists_in "dev"
          elif [ "$TARGET" == "master" ]; then
            check_exists_in "stg"
          fi
          echo "✅ Ancestry verified."